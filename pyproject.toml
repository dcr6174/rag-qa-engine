[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-qa-engine"
version = "0.3.0"
description = "An evaluation-first, offline-by-default RAG app with hybrid retrieval, abstention, and sentence-level citations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pypdf>=4.0",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Neural embeddings + cross-encoder reranker (the app runs fully offline without it).
neural = ["sentence-transformers>=2.7"]
# LLM answer generation via any OpenAI-compatible endpoint.
llm = ["openai>=1.30"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_qa = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
