name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: ruff
        run: ruff check src/ tests/ scripts/

      - name: black --check
        run: black --check src/ tests/ scripts/

      - name: mypy
        run: mypy src/rag_qa/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -q

      - name: Run the evaluation harness (retrieval regression gate)
        run: python scripts/run_eval.py
